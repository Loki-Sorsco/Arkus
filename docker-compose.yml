# Hosted Arkus for Dokploy (or any Docker host). Set the env values in Dokploy's Environment tab.
services:
  arkus:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ARKUS_MODE: cloud
      ARKUS_URL: ${ARKUS_URL}                      # public https URL, e.g. https://app.arkus.dev
      ARKUS_SECRET_KEY: ${ARKUS_SECRET_KEY}        # openssl rand -base64 32
      DATABASE_URL: postgresql://arkus:${POSTGRES_PASSWORD}@db:5432/arkus
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:-}              # optional server-wide fallback; users can add their own
    volumes:
      - arkus-data:/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkus
      POSTGRES_DB: arkus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - arkus-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkus -d arkus"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  arkus-data:
  arkus-pg:
